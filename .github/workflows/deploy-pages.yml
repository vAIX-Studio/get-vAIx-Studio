name: Déployer le site sur GitHub Pages (branche gh-pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production (base relative ./)
        run: npm run build

      - name: Vérifier que dist ne référence jamais /src/main.ts
        run: |
          if grep -R "src/main.ts" dist; then
            echo "ERREUR: référence dev trouvée dans dist" >&2
            exit 1
          fi
          test -f dist/.nojekyll
          test -f dist/index.html

      - name: Publier dist/ sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
